[workspace]
resolver = "2"
members = [
    "macros",
    "feature_sys",
    "feature_frm",
    "modules/simple",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 'z'

[workspace.dependencies]
feature_sys = { path = "feature_sys" }
feature_macros = { path = "macros" }
feature_frm = { path = "feature_frm" }
vdk = { path = "../../rust/vdk-rs/vdk" }
libc = "0.2"
proc-macro-error = "1.0"
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"
tokio = "1"
once_cell = "1.18"
async-trait = "0.1"
